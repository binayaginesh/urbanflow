# UrbanFlow Data & Network Modeling -- Master Configuration
# Module 1 (Alent Varkey) -- all tunable numbers live here; no magic numbers in code.

# == Study Area ================================================================
study_area:
  place_name: null
  bbox:
    north: 12.9505
    south: 12.8950
    east:  77.6450
    west:  77.5950
  small_bbox:
    north: 12.9310
    south: 12.9180
    east:  77.6270
    west:  77.6130

# == Coordinate Reference Systems ==============================================
crs:
  storage: "EPSG:4326"
  metric:  "EPSG:32643"

# == OSMnx Network Download ====================================================
osm:
  network_type: "drive"
  simplify:     false
  retain_all:   false

# == Intersection Consolidation ================================================
network_cleaning:
  consolidate_tolerance_m: 15
  dead_ends: false

# == Default Lanes by Road Class (used when OSM tag is missing) ================
default_lanes:
  motorway:       3
  motorway_link:  2
  trunk:          2
  trunk_link:     2
  primary:        2
  primary_link:   1
  secondary:      2
  secondary_link: 1
  tertiary:       1
  tertiary_link:  1
  residential:    1
  living_street:  1
  unclassified:   1
  service:        1

# == Default Speed Limits by Road Class (km/h) =================================
default_speed_kmh:
  motorway:       80
  motorway_link:  60
  trunk:          60
  trunk_link:     50
  primary:        50
  primary_link:   40
  secondary:      40
  secondary_link: 30
  tertiary:       30
  tertiary_link:  25
  residential:    25
  living_street:  15
  unclassified:   30
  service:        20

# == Free-Flow Speed Cap by Road Class (km/h) ==================================
free_flow_speed_cap_kmh:
  motorway:       70
  motorway_link:  55
  trunk:          55
  trunk_link:     45
  primary:        45
  primary_link:   35
  secondary:      35
  secondary_link: 28
  tertiary:       28
  tertiary_link:  22
  residential:    20
  living_street:  12
  unclassified:   28
  service:        15

free_flow_reduction_factor: 0.90

# == Capacity per Lane (PCU / hour / lane) =====================================
capacity_per_lane_pcu_hr:
  motorway:       1800
  motorway_link:  1600
  trunk:          1600
  trunk_link:     1500
  primary:        1500
  primary_link:   1300
  secondary:      1300
  secondary_link: 1000
  tertiary:       1000
  tertiary_link:  800
  residential:    700
  living_street:  500
  unclassified:   900
  service:        500

capacity_reduction_factor: 0.85

# == PCU Equivalents ===========================================================
pcu_equivalents:
  car:           1.0
  two_wheeler:   0.5
  auto_rickshaw: 0.8
  bus:           3.0
  truck:         3.0

# == Traffic Time Slots ========================================================
time_slots:
  - name: night_offpeak
    label: "Night Off-Peak"
    hour: 23
    minute: 0
  - name: morning_peak
    label: "Morning Peak"
    hour: 8
    minute: 30
  - name: midday
    label: "Midday"
    hour: 13
    minute: 30
  - name: evening_peak
    label: "Evening Peak"
    hour: 18
    minute: 0

# == BPR Volume-Delay Parameters ===============================================
bpr_defaults:
  alpha: 0.15
  beta:  4.0

# == Public Transport ===========================================================
transit:
  max_snap_distance_m: 50
  gtfs_zip_path: null
  # Stage B6: walking radius (m) used to flag a metro station as a bus-metro
  # interchange in the dashboard. Planning assumption; refine in Stage C.
  interchange_walk_radius_m: 400

# == Traffic Baseline Sampling =================================================
traffic_baseline:
  sample_routes_csv: "config/sample_routes.csv"
  api_provider: null
  cache_dir: "data/raw/traffic"
  target_corridor_count: 40

# == Optional API Toggles ======================================================
api:
  use_traffic_api: false
  google_api_key_env: "GOOGLE_MAPS_API_KEY"
  tomtom_api_key_env: "TOMTOM_API_KEY"
  here_api_key_env:   "HERE_API_KEY"

# == Output Paths ==============================================================
paths:
  raw_dir:       "data/raw"
  interim_dir:   "data/interim"
  processed_dir: "data/processed"
  provenance:    "data/PROVENANCE.md"
  blockers:      "docs/BLOCKERS.md"
  limitations:   "docs/LIMITATIONS.md"

# == Logging ===================================================================
logging:
  level: "INFO"
  log_file: "urbanflow_data.log"

# == Decision Intelligence / AI Layer (Stage A - Mehrin & Stage C - Alent) =====
decision_intelligence:
  # Weights for the 4 traffic criteria. Must sum to 1.0.
  # congestion_ratio: lower is better; speed: higher is better;
  # bus_delay_s: lower is better; emissions_index: lower is better.
  criteria_weights:
    congestion_ratio: 0.35
    speed_kmh:        0.30
    bus_delay_s:      0.20
    emissions_index:  0.15

  # Composite score boundaries (score in [0, 1]).
  # score >= recommended  -> RECOMMENDED
  # score >= moderate     -> MODERATE
  # score <  moderate     -> NOT RECOMMENDED
  verdict_thresholds:
    recommended: 0.60
    moderate:    0.40

  # Monte Carlo confidence estimation
  monte_carlo_n_runs: 200
  # Relative standard deviation applied to demand when perturbing (0.15 = +/-15%)
  monte_carlo_demand_sigma_pct: 0.15

  # Optimizer candidate interventions (used by optimizer.py / scripts/run_optimizer.py / scripts/run_library.py)
  # type: close_node | close_edge | add_edge
  # params: node_id or u/v/attrs
  # cost_index: 0-1 relative index (0 = free, 1 = very expensive) - used in TOPSIS
  # estimated_cost_inr_crore: left null where official DPR/BMRCL/BBMP cost estimates are unavailable
  # feasibility: 0-1 (1 = fully feasible)
  optimizer_candidates:
    - name: "Upgrade 1st Main - BTM Relief Corridor"
      type: add_edge
      params:
        u: 1
        v: 40
        attrs:
          edge_id: 9001
          length_m: 180.0
          lanes: 3
          highway: primary
          maxspeed_kmh: 50
          free_flow_speed_kmh: 45.0
          free_flow_time_s: 10.0
          capacity_pcu_per_hr: 3825.0
          is_bridge: false
          is_flyover: false
          has_signal_at_v: false
          name: "1st Main - BTM Relief Corridor"
          lanes_imputed: false
          speed_imputed: false
      cost_index: 0.35
      estimated_cost_inr_crore: null
      feasibility: 0.95

    - name: "Add Madiwala-BTM Collector Bypass"
      type: add_edge
      params:
        u: 52
        v: 40
        attrs:
          edge_id: 9002
          length_m: 220.0
          lanes: 3
          highway: primary
          maxspeed_kmh: 50
          free_flow_speed_kmh: 45.0
          free_flow_time_s: 12.0
          capacity_pcu_per_hr: 3825.0
          is_bridge: false
          is_flyover: false
          has_signal_at_v: false
          name: "Madiwala-BTM Collector Bypass"
          lanes_imputed: false
          speed_imputed: false
      cost_index: 0.50
      estimated_cost_inr_crore: null
      feasibility: 0.92

    - name: "Add HSR-Haralur Connector"
      type: add_edge
      params:
        u: 10
        v: 11
        attrs:
          edge_id: 9000
          length_m: 350.0
          lanes: 2
          highway: secondary
          maxspeed_kmh: 40
          free_flow_speed_kmh: 36.0
          free_flow_time_s: 28.0
          capacity_pcu_per_hr: 2210.0
          is_bridge: false
          is_flyover: false
          has_signal_at_v: false
          name: "HSR-Haralur Connector"
          lanes_imputed: false
          speed_imputed: false
      cost_index: 0.45
      estimated_cost_inr_crore: null
      feasibility: 0.88

    - name: "Add Silk Board-BTM Elevated Flyover"
      type: add_edge
      params:
        u: 48
        v: 69
        attrs:
          edge_id: 9003
          length_m: 750.0
          lanes: 3
          highway: trunk
          maxspeed_kmh: 60
          free_flow_speed_kmh: 55.0
          free_flow_time_s: 25.0
          capacity_pcu_per_hr: 4080.0
          is_bridge: true
          is_flyover: true
          has_signal_at_v: false
          name: "Silk Board-BTM Elevated Flyover"
          lanes_imputed: false
          speed_imputed: false
      cost_index: 0.80
      estimated_cost_inr_crore: null
      feasibility: 0.85

    - name: "Close Silk Board Flyover North (Node 48)"
      type: close_node
      params: {node_id: 48}
      cost_index: 0.10
      estimated_cost_inr_crore: null
      feasibility: 0.80

    - name: "Close BTM Udupi Garden Signal (Node 69)"
      type: close_node
      params: {node_id: 69}
      cost_index: 0.10
      estimated_cost_inr_crore: null
      feasibility: 0.70

    - name: "Close Madiwala Police Station Jct (Node 52)"
      type: close_node
      params: {node_id: 52}
      cost_index: 0.10
      estimated_cost_inr_crore: null
      feasibility: 0.75

# == Validation Harness (Stage B7 - Swathy) ===================================
validation:
  # Fraction of manually observed corridors held out from calibration (Stage C
  # uses a 70/30 split). Split is deterministic per corridor id + seed.
  holdout_fraction: 0.30
  holdout_seed: 42
  # Sanity range for reference congestion ratios (matches validate.py).
  congestion_ratio_range: [0.9, 7.0]
  # Max distance (m) between a sample-route endpoint and its snapped junction.
  corridor_max_snap_m: 1500
  # Accuracy target on hold-out corridors (MAPE %). Left null on purpose: the
  # target must be agreed with the guide in Stage C. While null, the harness
  # reports metrics without a pass/fail verdict.
  mape_target_pct: null

