[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-data"
version = "0.1.0"
description = "UrbanFlow Module 1 - Data and Network Modeling for Bengaluru"
requires-python = ">=3.10"
dependencies = [
    "osmnx>=1.9",
    "networkx>=3.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.5",
    "pyyaml>=6.0",
    "pandas>=1.5",
    "click>=8.0",
]

[project.scripts]
urbanflow-data = "urbanflow_data.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
